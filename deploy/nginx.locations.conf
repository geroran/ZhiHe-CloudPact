# Include inside the existing agent-server server block.
location = /zhihe { return 301 /zhihe/; }
location /zhihe/ {
    alias /opt/zhihe-yunqi/dist/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}
location ^~ /api/agent/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
location = /api/courses {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
}
location ~ ^/api/(me|login|logout|state|refresh|activity)$ {
    proxy_pass http://127.0.0.1:8770;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
}
location ~ ^/api/(health|config|chat|term-courses|market/(posts|hot|search)|charging/ports|course-grades/(search|info)|schedule/recognize)$ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:8011;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
}
